<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server Menu</title>
<style>
@font-face {
    font-family: 'Minecraft';
    src: url('fonts/Minecraft.ttf') format('truetype');
    font-display: swap;
}

body {
    margin: 0;
    font-family: 'Minecraft', sans-serif;
    background: url('https://assets.badlion.net/blog/minecraft-backgrounds/jungle-lake.webp') no-repeat center center/cover;
    height: 100vh;
    color: white;
    text-shadow: 2px 2px #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

}

/* Logo */
.logo {
    margin-top: 40px;
    width: 600px;
    image-rendering: pixelated;
}

/* Splash text (yellow) */
.splash {
    position: absolute;
    top: 110px;
    right: 220px;
    color: yellow;
    font-size: 1.2em;
    transform: rotate(-15deg);
}

/* Menu buttons layout */
.menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn {
    width: 300px;
    padding: 12px;
    background: #6b6b6b;
    border: 4px solid #000;
    color: white;
    text-decoration: none;
    font-size: 1.1em;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
}

.btn:hover {
    background: #999;
}

/* Bottom buttons row */
.bottom-buttons {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
}

.bottom-btn {
    width: 145px;
    padding: 10px;
    background: #6b6b6b;
    border: 4px solid #000;
    color: white;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
}
.bottom-btn:hover {
    background: #999;
}

/* Footer */
.footer {
    font-size: 0.8em;
    margin-bottom: 5px;
}

/* Modal styles */
.modal {
    display: none;
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
}
.modal-content {
    background: #3b3b3b;
    padding: 20px;
    border: 3px solid #000;
    color: white;
    text-align: center;
    width: 350px;
}
.modal img {
    width: 64px;
    height: 64px;
    margin: 5px;
}
.close {
    background: #aa0000;
    padding: 5px 10px;
    display: inline-block;
    margin-top: 10px;
    cursor: pointer;
    border: 2px solid #000;
}
</style>
</head>
<body>

<img id="logo" class="logo">
<div class="splash" id="splash"></div>

<div class="menu" id="menuButtons"></div>

<div class="bottom-buttons">
    <div class="bottom-btn">Options</div>
    <div class="bottom-btn" onclick="window.close()">Quit Game</div>
</div>

<div class="footer" id="footer"></div>

<!-- Modals -->
<div class="modal" id="staffModal">
    <div class="modal-content">
        <h2>Staff Members</h2>
        <div id="staffList"></div>
        <div class="close" onclick="closeModal('staffModal')">Close</div>
    </div>
</div>

<div class="modal" id="aboutModal">
    <div class="modal-content">
        <h2>About Our Server</h2>
        <p id="aboutText"></p>
        <div class="close" onclick="closeModal('aboutModal')">Close</div>
    </div>
</div>

<div class="modal" id="featuresModal">
    <div class="modal-content">
        <h2>Features</h2>
        <p id="featuresText"></p>
        <div class="close" onclick="closeModal('featuresModal')">Close</div>
    </div>
</div>

<div class="modal" id="contactModal">
    <div class="modal-content">
        <h2>Contact Us</h2>
        <p id="contactText"></p>
        <div class="close" onclick="closeModal('contactModal')">Close</div>
    </div>
</div>

<script>
let configData = {};

fetch('config.json')
    .then(res => res.json())
    .then(config => {
        configData = config;
        document.body.style.backgroundImage = `url('${config.background}')`;
        document.getElementById('logo').src = config.logo;
        document.getElementById('splash').innerText = config.splash;
        document.getElementById('footer').innerHTML = `${config.version}<br>${config.copyright}`;
        document.getElementById('aboutText').innerHTML = config.aboutText;
        document.getElementById('featuresText').innerHTML = config.featuresText;
        document.getElementById('contactText').innerHTML = config.contactText;
        
        let menu = document.getElementById('menuButtons');
        config.buttons.forEach(btn => {
            let div = document.createElement('div');
            div.className = 'btn';
            div.innerText = btn.label;
            if (btn.action === 'copyIP') {
                div.onclick = () => copyIP();
            } else if (btn.action === 'modal') {
                div.onclick = () => openModal(btn.target);
            }
            menu.appendChild(div);
        });

        let staffList = document.getElementById('staffList');
        config.staff.forEach(member => {
            let mdiv = document.createElement('div');
            mdiv.innerHTML = `<img src="${member.avatar}"><br>${member.name}`;
            staffList.appendChild(mdiv);
        });
    });

function copyIP() {
    navigator.clipboard.writeText(configData.serverIP).then(() => {
        alert("Server IP copied to clipboard!");
    });
}
function openModal(id) {
    document.getElementById(id).style.display = "flex";
}
function closeModal(id) {
    document.getElementById(id).style.display = "none";
}
</script>

</body>
</html>
